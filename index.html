<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Monopoly Bank NFC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
  try {
    var s = (JSON.parse(localStorage.getItem('monopoly-bank-nfc-v1')) || {}).settings || {};
    var th = s.theme || 'dark';
    if (th === 'auto') th = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', th === 'light' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-accent', s.accent || 'blue');
  } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <h1>Monopoly Bank</h1>
      <div class="sub" data-i18n="app_sub"></div>
    </div>
  </div>
  <div class="top-right">
    <span id="nfcChip" class="chip">NFC</span>
    <button id="btnSettings" class="icon-btn" data-i18n-aria="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main>

  <!-- PEMAIN -->
  <section id="view-players" class="view active">
    <div class="hero">
      <div class="hero-label" data-i18n="total_money">Total money in play</div>
      <div class="hero-value" id="totalMoney">M0</div>
    </div>

    <form id="addForm" class="card add-form" autocomplete="off">
      <input id="newName" type="text" maxlength="14" placeholder="New player name" data-i18n-ph="new_player_ph" required>
      <button class="btn primary" type="submit" data-i18n="add">+ Add</button>
    </form>

    <div class="row-actions">
      <button id="btnCheck" class="btn ghost full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(-1.8 0)"><path d="M8.5 8.5a5 5 0 0 1 0 7"/><path d="M12 6a8.5 8.5 0 0 1 0 12"/><path d="M15.5 3.5a12 12 0 0 1 0 17"/></g></svg> <span data-i18n="check_balance">Check balance (scan card)</span></button>
    </div>

    <div id="playerList" class="list"></div>
  </section>

  <!-- PINDAH -->
  <section id="view-transfer" class="view">
    <div class="card">
      <h2 data-i18n="transfer_title">Transfer money between players</h2>
      <p class="muted" data-i18n="transfer_desc"></p>
      <div id="transferAmt"></div>
      <button id="btnTransfer" class="btn primary big full" data-i18n="start_transfer">Start transfer</button>
    </div>
  </section>

  <!-- BANK -->
  <section id="view-bank" class="view">
    <div class="card">
      <h2 data-i18n="bank_title">Bank actions</h2>
      <p class="muted" data-i18n="bank_desc"></p>
      <div class="quick-grid">
        <button class="quick in" data-dir="in" data-amt="200" data-note="note_go">
          <span class="q-title" data-i18n="note_go"></span><span class="q-amt">+<b data-q="200"></b></span>
        </button>
        <button class="quick out" data-dir="out" data-amt="200" data-note="note_income">
          <span class="q-title" data-i18n="note_income"></span><span class="q-amt">−<b data-q="200"></b></span>
        </button>
        <button class="quick out" data-dir="out" data-amt="75" data-note="note_luxury">
          <span class="q-title" data-i18n="note_luxury"></span><span class="q-amt">−<b data-q="75"></b></span>
        </button>
        <button class="quick out" data-dir="out" data-amt="50" data-note="note_jail">
          <span class="q-title" data-i18n="note_jail"></span><span class="q-amt">−<b data-q="50"></b></span>
        </button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="other_amount">Other amount</h2>
      <div id="bankAmt"></div>
      <div class="two-btn">
        <button id="btnBankIn" class="btn good big" data-i18n="bank_pays">Bank pays player</button>
        <button id="btnBankOut" class="btn bad big" data-i18n="player_pays">Player pays bank</button>
      </div>
    </div>
  </section>

  <!-- SEJARAH -->
  <section id="view-history" class="view">
    <div class="card">
      <div class="hist-head">
        <h2 data-i18n="history_title">Transaction history</h2>
        <button id="btnUndo" class="btn ghost small"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg> <span data-i18n="undo">Undo last</span></button>
      </div>
      <div id="historyList" class="hist"></div>
    </div>
  </section>

</main>

<nav class="tabbar">
  <span class="tab-pill no-anim" aria-hidden="true"></span>
  <button class="tab active" data-view="players"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.2"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"/><path d="M15.5 4.9a3.2 3.2 0 0 1 0 6.2"/></svg></span><span class="tab-label" data-i18n="tab_players"></span></button>
  <button class="tab" data-view="transfer"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14"/><path d="M14 4l4 4-4 4"/><path d="M20 16H6"/><path d="M10 12l-4 4 4 4"/></svg></span><span class="tab-label" data-i18n="tab_transfer"></span></button>
  <button class="tab" data-view="bank"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5.5 10v7.5M9.8 10v7.5M14.2 10v7.5M18.5 10v7.5"/><path d="M3 20h18"/></svg></span><span class="tab-label" data-i18n="tab_bank"></span></button>
  <button class="tab" data-view="history"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><span class="tab-label" data-i18n="tab_history"></span></button>
</nav>

<!-- Modal imbas -->
<div id="scanModal" class="modal">
  <div class="sheet center">
    <button type="button" class="x-btn" id="scanX" data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="scanStep" class="step"></div>
    <div class="pulse"><div class="ring"></div><div class="ring r2"></div><div class="nfc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(-1.8 0)"><path d="M8.5 8.5a5 5 0 0 1 0 7"/><path d="M12 6a8.5 8.5 0 0 1 0 12"/><path d="M15.5 3.5a12 12 0 0 1 0 17"/></g></svg></div></div>
    <h3 id="scanTitle"></h3>
    <p id="scanHint" class="muted"></p>
    <p id="scanErr" class="err-line"></p>
    <div id="simBox" class="sim-box"></div>
    <button id="scanCancel" class="btn ghost full" data-i18n="cancel">Cancel</button>
  </div>
</div>

<!-- Modal keputusan -->
<div id="resultModal" class="modal">
  <div class="sheet center">
    <button type="button" class="x-btn" id="resX" data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="resIcon" class="res-icon"></div>
    <h3 id="resTitle"></h3>
    <div id="resBody" class="res-body"></div>
    <button id="resOk" class="btn primary full">OK</button>
  </div>
</div>

<!-- Modal tetapan -->
<div id="settingsModal" class="modal">
  <div class="sheet">
    <button type="button" class="x-btn" id="setX" data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h3 data-i18n="settings_title">Settings</h3>
    <label class="field"><span data-i18n="set_start"></span>
      <input id="setStart" type="number" min="0" step="1" inputmode="numeric">
    </label>
    <label class="field"><span data-i18n="set_symbol"></span>
      <select id="setSymbol">
        <option value="M">M (Monopoly)</option>
        <option value="RM">RM</option>
        <option value="$">$</option>
        <option value="£">£</option>
      </select>
    </label>
    <label class="field"><span data-i18n="set_lang"></span>
      <select id="setLang">
        <option value="en">English</option>
        <option value="ms">Bahasa Melayu</option>
      </select>
    </label>
    <div class="field"><span data-i18n="set_theme"></span>
      <div class="seg" id="setTheme" role="group">
        <button type="button" data-v="auto" data-i18n="theme_auto"></button>
        <button type="button" data-v="dark" data-i18n="theme_dark"></button>
        <button type="button" data-v="light" data-i18n="theme_light"></button>
      </div>
    </div>
    <div class="field"><span data-i18n="set_accent"></span>
      <div class="swatches" id="setAccent" role="group">
        <button type="button" class="sw" data-v="blue" style="--c:#2f80ff" data-i18n-aria="acc_blue"></button>
        <button type="button" class="sw" data-v="green" style="--c:#12b76a" data-i18n-aria="acc_green"></button>
        <button type="button" class="sw" data-v="purple" style="--c:#8b5cf6" data-i18n-aria="acc_purple"></button>
        <button type="button" class="sw" data-v="orange" style="--c:#f97316" data-i18n-aria="acc_orange"></button>
        <button type="button" class="sw" data-v="pink" style="--c:#ec4899" data-i18n-aria="acc_pink"></button>
      </div>
    </div>
    <label class="check">
      <input id="setSim" type="checkbox"> <span data-i18n="set_sim"></span>
    </label>
    <label class="check">
      <input id="setSound" type="checkbox"> <span data-i18n="set_sound"></span>
    </label>
    <div class="two-btn">
      <button id="btnResetGame" class="btn ghost" data-i18n="reset_btn">Restart game (keep players)</button>
      <button id="btnWipe" class="btn bad" data-i18n="wipe_btn">Delete all</button>
    </div>
    <button id="setClose" class="btn primary full" data-i18n="done">Done</button>
  </div>
</div>

<!-- Modal pengesahan -->
<div id="confirmModal" class="modal">
  <div class="sheet center">
    <button type="button" class="x-btn" id="cfX" data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="res-icon warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5v7"/><circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/></svg></div>
    <h3 id="cfTitle"></h3>
    <div id="cfBody" class="res-body"></div>
    <div class="two-btn">
      <button id="cfCancel" class="btn ghost big" data-i18n="cancel">Cancel</button>
      <button id="cfOk" class="btn bad big">OK</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || 'error') + ' [' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0) + ']');
});
</script>
<script src="app.js"></script>
<script>
window.addEventListener('load', function () {
  if (window.__appLoaded) return;
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;background:#b91c1c;color:#fff;padding:12px;font:13px/1.45 sans-serif;text-align:left;word-break:break-word';
  d.textContent = 'app.js is not running. Checking why...';
  document.body.appendChild(d);
  var info = ['app.js is not running.'];
  if (window.__errs.length) info.push('Error: ' + window.__errs.join(' | '));
  fetch('app.js', { cache: 'no-store' }).then(function (r) {
    info.push('Status: ' + r.status + ', type: ' + (r.headers.get('content-type') || 'none'));
    return r.text();
  }).then(function (t) {
    info.push('Size: ' + t.length + ' chars. Starts: ' + t.slice(0, 40).replace(/\s+/g, ' '));
  }).catch(function (e) {
    info.push('Could not fetch app.js: ' + e);
  }).then(function () {
    d.textContent = info.join('  ·  ');
  });
});
</script>
</body>
</html>
