<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Monopoly Bank NFC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
:root{
  --bg:#0b1220;
  --bg2:#111a2e;
  --card:#16213a;
  --card2:#1c2947;
  --line:rgba(255,255,255,.08);
  --text:#eaf0ff;
  --muted:#8fa0c4;
  --accent:#3dd9a0;
  --accent2:#2f80ff;
  --good:#22c55e;
  --bad:#ef4444;
  --warn:#f59e0b;
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(47,128,255,.18), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(61,217,160,.14), transparent 60%),
    var(--bg);
  padding-bottom:calc(84px + var(--safe-b));
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input,select{font:inherit;color:var(--text)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;
  max-width:600px;margin:0 auto;padding:16px 16px 6px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-weight:800;font-size:22px;color:#06281c;
  background:linear-gradient(135deg,#3dd9a0,#2f80ff);box-shadow:0 6px 18px rgba(47,128,255,.35)}
h1{font-size:18px;margin:0;letter-spacing:.2px}
.sub{font-size:12px;color:var(--muted)}
.top-right{display:flex;gap:8px;align-items:center}
.chip{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;
  background:rgba(255,255,255,.07);color:var(--muted)}
.chip.on{background:rgba(61,217,160,.15);color:var(--accent)}
.chip.sim{background:rgba(245,158,11,.15);color:var(--warn)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);font-size:18px}

main{max-width:600px;margin:0 auto;padding:8px 16px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:17px}
.muted{color:var(--muted);font-size:13px;margin:4px 0 12px;line-height:1.45}

.hero{margin:12px 0;padding:18px;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(47,128,255,.25),rgba(61,217,160,.2));
  border:1px solid var(--line)}
.hero-label{font-size:12px;color:var(--muted)}
.hero-value{font-size:34px;font-weight:800;margin-top:2px;letter-spacing:.3px}

/* buttons */
.btn{padding:12px 16px;border-radius:14px;font-weight:700;background:var(--card2);transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),#5aa0ff);color:#fff}
.btn.good{background:linear-gradient(135deg,#16a34a,#22c55e);color:#04210f}
.btn.bad{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn.big{padding:16px;font-size:16px}
.btn.small{padding:8px 12px;font-size:12px;border-radius:10px}
.btn.full{width:100%}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row-actions{margin:0 0 6px}

/* add form */
.add-form{display:flex;gap:10px;padding:12px}
.add-form input{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;outline:none}
.add-form input:focus,.field input:focus,.field select:focus{border-color:var(--accent2)}

/* players */
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.player{background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  border-left:6px solid var(--pc,#888)}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;font-weight:700}
.badge.ok{background:rgba(34,197,94,.15);color:#4ade80}
.badge.no{background:rgba(245,158,11,.15);color:var(--warn)}
.p-bal{font-size:28px;font-weight:800;margin:8px 0 6px}
.notes{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.note{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;color:#1b1b1b;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.p-actions{display:flex;gap:8px;flex-wrap:wrap}
.p-actions .btn{padding:8px 12px;font-size:12px;border-radius:10px}

/* amount picker */
.amt-row{display:flex;gap:10px;align-items:center;margin:8px 0}
.amt-box{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);
  border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.amt-sym{font-size:22px;font-weight:800;color:var(--accent)}
.amt-box input{flex:1;min-width:0;background:transparent;border:0;outline:none;
  font-size:30px;font-weight:800;padding:8px 0;width:100%}
.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.denom{padding:12px 0;border-radius:10px;font-weight:800;color:#1b1b1b;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.25);transition:.1s}
.denom:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.denom.clear{background:rgba(255,255,255,.1);color:var(--text);box-shadow:none}
.amt-wrap{margin-bottom:12px}

/* bank quick */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
.quick:active{transform:scale(.97)}
.q-title{font-size:13px;color:var(--muted)}
.q-amt{font-size:22px;font-weight:800}
.quick.in .q-amt{color:#4ade80}
.quick.out .q-amt{color:#f87171}

/* history */
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hist{display:flex;flex-direction:column}
.h-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--line)}
.h-item:last-child{border:0}
.h-main{font-size:14px;font-weight:600}
.h-sub{font-size:12px;color:var(--muted);margin-top:2px}
.h-amt{font-weight:800;white-space:nowrap}
.h-amt.pos{color:#4ade80}.h-amt.neg{color:#f87171}.h-amt.neu{color:var(--text)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;
  padding:8px 10px calc(8px + var(--safe-b));background:rgba(11,18,32,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.tab{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;border-radius:12px;background:transparent;color:var(--muted);font-size:11px;font-weight:700}
.tab span{font-size:20px}
.tab.active{background:rgba(47,128,255,.16);color:#fff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(3,7,16,.7);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal.open{display:flex;animation:fade .2s ease}
.sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#1b2846,#121b30);
  border:1px solid var(--line);border-radius:24px;padding:22px 18px calc(18px + var(--safe-b));
  max-height:92vh;overflow:auto}
.sheet.center{text-align:center}
.sheet h3{margin:6px 0 4px;font-size:20px}
.step{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);
  background:rgba(61,217,160,.12);padding:4px 10px;border-radius:999px;margin-bottom:6px}
.step:empty{display:none}
.pulse{position:relative;width:130px;height:130px;margin:14px auto 8px;display:grid;place-items:center}
.nfc-ico{font-size:44px;z-index:2}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);
  animation:ping 1.8s ease-out infinite;opacity:0}
.ring.r2{animation-delay:.9s}
@keyframes ping{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.err-line{color:#fca5a5;font-size:13px;min-height:0;margin:4px 0 8px}
.err-line:empty{display:none}
.sim-box{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.sim-box:empty{display:none}
.sim-title{font-size:12px;color:var(--warn);font-weight:700}
.sim-btn{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700;
  border-left:5px solid var(--pc,#888)}
.sim-btn small{color:var(--muted);font-weight:600}

.res-icon{width:72px;height:72px;border-radius:50%;margin:4px auto 10px;display:grid;place-items:center;
  font-size:36px;font-weight:800}
.res-icon.ok{background:rgba(34,197,94,.18);color:#4ade80}
.res-icon.err{background:rgba(239,68,68,.18);color:#f87171}
.res-icon.warn{background:rgba(245,158,11,.18);color:var(--warn)}
.res-body{color:var(--muted);font-size:14px;line-height:1.55;margin:8px 0 16px}
.res-body b{color:var(--text)}
.res-line{display:flex;justify-content:space-between;padding:8px 12px;margin:6px 0;
  background:rgba(255,255,255,.05);border-radius:10px;color:var(--text)}

/* settings */
.field{display:block;font-size:13px;color:var(--muted);margin:14px 0}
.field input,.field select{display:block;width:100%;margin-top:6px;background:rgba(0,0,0,.28);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.field select option{background:#16213a}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:14px 0}
.check input{width:20px;height:20px}
#setClose{margin-top:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);
  background:#0f172a;border:1px solid var(--line);padding:10px 16px;border-radius:12px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;
  max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .modal{align-items:center}
}

</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <h1>Monopoly Bank</h1>
      <div class="sub">Bank digital kad NFC</div>
    </div>
  </div>
  <div class="top-right">
    <span id="nfcChip" class="chip">NFC</span>
    <button id="btnSettings" class="icon-btn" aria-label="Tetapan">⚙</button>
  </div>
</header>

<main>

  <!-- PEMAIN -->
  <section id="view-players" class="view active">
    <div class="hero">
      <div class="hero-label">Jumlah wang dalam permainan</div>
      <div class="hero-value" id="totalMoney">M0</div>
    </div>

    <form id="addForm" class="card add-form" autocomplete="off">
      <input id="newName" type="text" maxlength="14" placeholder="Nama pemain baru" required>
      <button class="btn primary" type="submit">+ Tambah</button>
    </form>

    <div class="row-actions">
      <button id="btnCheck" class="btn ghost full">📡 Semak baki (scan kad)</button>
    </div>

    <div id="playerList" class="list"></div>
  </section>

  <!-- PINDAH -->
  <section id="view-transfer" class="view">
    <div class="card">
      <h2>Pindah wang antara pemain</h2>
      <p class="muted">Pilih jumlah → P1 scan kad (baki disahkan) → P2 scan kad untuk menerima.</p>
      <div id="transferAmt"></div>
      <button id="btnTransfer" class="btn primary big full">Mula pindahan</button>
    </div>
  </section>

  <!-- BANK -->
  <section id="view-bank" class="view">
    <div class="card">
      <h2>Urusan dengan Bank</h2>
      <p class="muted">Cepat — scan kad pemain selepas tekan.</p>
      <div class="quick-grid">
        <button class="quick in" data-dir="in" data-amt="200" data-note="Lalu GO">
          <span class="q-title">Lalu GO</span><span class="q-amt">+<b data-q="200"></b></span>
        </button>
        <button class="quick out" data-dir="out" data-amt="200" data-note="Cukai Pendapatan">
          <span class="q-title">Cukai Pendapatan</span><span class="q-amt">−<b data-q="200"></b></span>
        </button>
        <button class="quick out" data-dir="out" data-amt="75" data-note="Cukai Mewah">
          <span class="q-title">Cukai Mewah</span><span class="q-amt">−<b data-q="75"></b></span>
        </button>
        <button class="quick out" data-dir="out" data-amt="50" data-note="Denda Penjara">
          <span class="q-title">Denda Penjara</span><span class="q-amt">−<b data-q="50"></b></span>
        </button>
      </div>
    </div>

    <div class="card">
      <h2>Jumlah lain</h2>
      <div id="bankAmt"></div>
      <div class="two-btn">
        <button id="btnBankIn" class="btn good big">Bank bayar pemain</button>
        <button id="btnBankOut" class="btn bad big">Pemain bayar bank</button>
      </div>
    </div>
  </section>

  <!-- SEJARAH -->
  <section id="view-history" class="view">
    <div class="card">
      <div class="hist-head">
        <h2>Sejarah transaksi</h2>
        <button id="btnUndo" class="btn ghost small">↩ Buat asal terakhir</button>
      </div>
      <div id="historyList" class="hist"></div>
    </div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab active" data-view="players"><span>👥</span>Pemain</button>
  <button class="tab" data-view="transfer"><span>💸</span>Pindah</button>
  <button class="tab" data-view="bank"><span>🏦</span>Bank</button>
  <button class="tab" data-view="history"><span>🧾</span>Sejarah</button>
</nav>

<!-- Modal imbas -->
<div id="scanModal" class="modal">
  <div class="sheet center">
    <div id="scanStep" class="step"></div>
    <div class="pulse"><div class="ring"></div><div class="ring r2"></div><div class="nfc-ico">📶</div></div>
    <h3 id="scanTitle"></h3>
    <p id="scanHint" class="muted"></p>
    <p id="scanErr" class="err-line"></p>
    <div id="simBox" class="sim-box"></div>
    <button id="scanCancel" class="btn ghost full">Batal</button>
  </div>
</div>

<!-- Modal keputusan -->
<div id="resultModal" class="modal">
  <div class="sheet center">
    <div id="resIcon" class="res-icon"></div>
    <h3 id="resTitle"></h3>
    <div id="resBody" class="res-body"></div>
    <button id="resOk" class="btn primary full">OK</button>
  </div>
</div>

<!-- Modal tetapan -->
<div id="settingsModal" class="modal">
  <div class="sheet">
    <h3>Tetapan</h3>
    <label class="field">Wang permulaan pemain baru
      <input id="setStart" type="number" min="0" step="1" inputmode="numeric">
    </label>
    <label class="field">Simbol mata wang
      <select id="setSymbol">
        <option value="M">M (Monopoly)</option>
        <option value="RM">RM</option>
        <option value="$">$</option>
        <option value="£">£</option>
      </select>
    </label>
    <label class="check">
      <input id="setSim" type="checkbox"> Mod simulasi (tiada NFC, pilih kad di skrin)
    </label>
    <label class="check">
      <input id="setSound" type="checkbox"> Bunyi (daftar kad, amaran, berjaya)
    </label>
    <div class="two-btn">
      <button id="btnResetGame" class="btn ghost">Mula semula (kekal pemain)</button>
      <button id="btnWipe" class="btn bad">Padam semua</button>
    </div>
    <button id="setClose" class="btn primary full">Siap</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || 'ralat') + ' [' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0) + ']');
});
</script>
<script>
'use strict';
window.__appLoaded = true;

/* ================= Konfigurasi ================= */
// Denominasi wang kertas Monopoly sebenar
const DENOMS = [500, 100, 50, 20, 10, 5, 1];
const NOTE_COLORS = {
  1: '#f4f4ee', 5: '#f4a6c0', 10: '#f7e463', 20: '#7fd18b',
  50: '#6fa8f0', 100: '#e6cf9f', 500: '#f59b42'
};
const PALETTE = ['#ef4444', '#f59e0b', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#a3a3a3'];
const KEY = 'monopoly-bank-nfc-v1';
const MAX_PLAYERS = 8;

/* ================= State ================= */
function defaultState() {
  return { players: [], history: [], settings: { start: 1500, symbol: 'M', sim: false, sound: true } };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.players)) {
      s.history = s.history || [];
      s.settings = Object.assign(defaultState().settings, s.settings || {});
      return s;
    }
  } catch (e) { /* abaikan */ }
  return defaultState();
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* abaikan */ }
}

/* ================= Util ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => state.settings.symbol + Number(n).toLocaleString('en-US');
const byUid = uid => state.players.find(p => p.uid === uid);
const byId = id => state.players.find(p => p.id === id);
const vibe = (p = 60) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* abaikan */ } };

/* ================= Bunyi (dijana dalam kod, tiada fail audio) ================= */
const Sound = {
  ctx: null,
  get enabled() { return state.settings.sound !== false; },
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* abaikan */ }
  },
  tone(freq, start, dur, type = 'sine', gain = 0.25) {
    const c = this.ctx;
    const t = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  play(fn) {
    if (!this.enabled) return;
    this.unlock();
    if (!this.ctx) return;
    try { fn.call(this); } catch (e) { /* abaikan */ }
  },
  scan()       { this.play(function () { this.tone(1175, 0, 0.12, 'sine', 0.22); this.tone(1568, 0.1, 0.18, 'sine', 0.22); }); },
  registered() { this.play(function () { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12 + i * 0.09, 0.35, 'triangle', 0.2)); }); },
  success()    { this.play(function () { [659, 784, 988, 1319].forEach((f, i) => this.tone(f, i * 0.09, 0.45, 'triangle', 0.22)); }); },
  warning()    { this.play(function () { this.tone(220, 0, 0.25, 'square', 0.12); this.tone(220, 0.32, 0.25, 'square', 0.12); }); },
  error()      { this.play(function () { this.tone(330, 0, 0.18, 'sawtooth', 0.12); this.tone(220, 0.16, 0.35, 'sawtooth', 0.12); }); }
};
// Pelayar hanya benarkan bunyi selepas pengguna menyentuh skrin
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => Sound.unlock(), { passive: true }));

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(id) { $('#' + id).classList.add('open'); }
function closeModal(id) { $('#' + id).classList.remove('open'); }

function breakdown(amount) {
  let left = amount;
  const out = [];
  for (const d of DENOMS) {
    const n = Math.floor(left / d);
    if (n > 0) { out.push([d, n]); left -= n * d; }
  }
  return out;
}

/* ================= NFC ================= */
const NFC = {
  ok: 'NDEFReader' in window,
  started: false,
  listener: null,
  lastAt: 0,
  async start() {
    if (this.started) return;
    const reader = new NDEFReader();
    await reader.scan();
    reader.addEventListener('reading', e => this.onRead(e));
    reader.addEventListener('readingerror', () => {
      if (this.listener) setScanErr('Kad tak dapat dibaca. Cuba dekatkan semula.');
    });
    this.started = true;
  },
  onRead(e) {
    const now = Date.now();
    if (!this.listener || now - this.lastAt < 1500) return;
    const uid = (e.serialNumber || '').toUpperCase();
    if (!uid) { setScanErr('Kad ini tiada nombor siri. Guna kad lain.'); return; }
    this.lastAt = now;
    const l = this.listener;
    this.listener = null;
    l(uid);
  }
};

function useSim() { return !NFC.ok || state.settings.sim; }
function nfcErrMsg(err) {
  if (!err) return 'Ralat NFC.';
  if (err.name === 'NotAllowedError') return 'Kebenaran NFC ditolak. Benarkan NFC untuk laman ini dalam tetapan Chrome.';
  if (err.name === 'NotSupportedError') return 'NFC dimatikan. Hidupkan NFC dalam tetapan telefon.';
  return err.message || 'Ralat NFC.';
}
function setScanErr(msg) { $('#scanErr').textContent = msg || ''; }

let scanDone = null;
function scanCard({ title, hint, step = '', mode = 'use' }) {
  return new Promise(resolve => {
    const done = uid => {
      if (uid) Sound.scan();
      NFC.listener = null;
      scanDone = null;
      closeModal('scanModal');
      resolve(uid);
    };
    scanDone = done;
    $('#scanStep').textContent = step;
    $('#scanTitle').textContent = title;
    $('#scanHint').textContent = hint;
    setScanErr('');
    renderSim(mode);
    openModal('scanModal');
    if (!useSim()) {
      NFC.listener = uid => { vibe(); done(uid); };
      NFC.start().catch(err => setScanErr(nfcErrMsg(err)));
    } else {
      NFC.listener = null;
    }
  });
}
$('#scanCancel').addEventListener('click', () => scanDone && scanDone(null));

function renderSim(mode) {
  const box = $('#simBox');
  box.innerHTML = '';
  if (!useSim()) return;
  let html = '<div class="sim-title">MOD SIMULASI — pilih kad di skrin</div>';
  if (mode === 'register') {
    html += '<button class="sim-btn" data-uid="__new__">Jana kad simulasi baru</button>';
  } else {
    const list = state.players.filter(p => p.uid);
    if (!list.length) html += '<div class="muted">Tiada kad didaftar lagi.</div>';
    list.forEach(p => {
      html += `<button class="sim-btn" style="--pc:${p.color}" data-uid="${esc(p.uid)}">${esc(p.name)}<small>${fmt(p.balance)}</small></button>`;
    });
  }
  box.innerHTML = html;
}
$('#simBox').addEventListener('click', e => {
  const b = e.target.closest('.sim-btn');
  if (!b || !scanDone) return;
  let uid = b.dataset.uid;
  if (uid === '__new__') uid = 'SIM-' + Math.random().toString(16).slice(2, 10).toUpperCase();
  scanDone(uid);
});

/* ================= Keputusan ================= */
function showResult(kind, title, html) {
  return new Promise(resolve => {
    const icon = { ok: '✓', err: '✕', warn: '!' }[kind];
    if (kind === 'ok') Sound.success(); else if (kind === 'warn') Sound.warning(); else Sound.error();
    const el = $('#resIcon');
    el.className = 'res-icon ' + kind;
    el.textContent = icon;
    $('#resTitle').textContent = title;
    $('#resBody').innerHTML = html;
    openModal('resultModal');
    $('#resOk').onclick = () => { closeModal('resultModal'); resolve(); };
  });
}

/* ================= Logik wang ================= */
function addHist(h) {
  state.history.unshift(Object.assign({ id: Date.now() + '-' + Math.random().toString(16).slice(2, 6), t: Date.now() }, h));
  if (state.history.length > 200) state.history.length = 200;
}

async function doTransfer() {
  const amt = transferAmt.get();
  if (!amt || amt <= 0) { toast('Masukkan jumlah dulu'); return; }
  if (state.players.length < 2) { toast('Perlu sekurang-kurangnya 2 pemain'); return; }

  // Langkah 1: pengirim
  const uidA = await scanCard({
    step: 'Langkah 1/2', title: 'Pemain 1 — Pengirim',
    hint: `Imbas kad pemain yang akan membayar ${fmt(amt)}`
  });
  if (!uidA) { toast('Dibatalkan'); return; }
  const sender = byUid(uidA);
  if (!sender) {
    vibe([80, 60, 80]);
    return showResult('err', 'Kad tidak dikenali', 'Kad ini belum didaftarkan kepada mana-mana pemain.');
  }
  if (sender.balance < amt) {
    vibe([120, 60, 120]);
    return showResult('warn', 'Baki tak cukup',
      `<b>${esc(sender.name)}</b> hanya ada <b>${fmt(sender.balance)}</b>.<br>
       Jumlah diperlukan <b>${fmt(amt)}</b>.
       <div class="res-line"><span>Kurang</span><b>${fmt(amt - sender.balance)}</b></div>`);
  }

  // Langkah 2: penerima
  const uidB = await scanCard({
    step: 'Langkah 2/2', title: 'Pemain 2 — Penerima',
    hint: `✓ ${sender.name} disahkan (baki ${fmt(sender.balance)}). Imbas kad penerima.`
  });
  if (!uidB) { toast('Dibatalkan — tiada wang dipindah'); return; }
  const receiver = byUid(uidB);
  if (!receiver) {
    vibe([80, 60, 80]);
    return showResult('err', 'Kad tidak dikenali', 'Kad penerima belum didaftarkan.');
  }
  if (receiver.id === sender.id) {
    vibe([80, 60, 80]);
    return showResult('err', 'Kad sama', 'Pengirim dan penerima tidak boleh pemain yang sama.');
  }

  // Sahkan semula & laksana
  if (sender.balance < amt) return showResult('warn', 'Baki tak cukup', 'Baki berubah. Sila cuba lagi.');
  sender.balance -= amt;
  receiver.balance += amt;
  addHist({ type: 'transfer', from: sender.id, to: receiver.id, fromName: sender.name, toName: receiver.name, amount: amt });
  save(); renderAll(); vibe([60, 40, 60]);
  transferAmt.clear();

  await showResult('ok', 'Pindahan berjaya',
    `<div class="res-line"><span>${esc(sender.name)}</span><b>−${fmt(amt)}</b></div>
     <div class="res-line"><span>${esc(receiver.name)}</span><b>+${fmt(amt)}</b></div>
     <div class="res-line"><span>Baki ${esc(sender.name)}</span><b>${fmt(sender.balance)}</b></div>
     <div class="res-line"><span>Baki ${esc(receiver.name)}</span><b>${fmt(receiver.balance)}</b></div>`);
}

async function doBank(dir, amt, note) {
  if (!amt || amt <= 0) { toast('Masukkan jumlah dulu'); return; }
  const uid = await scanCard({
    title: dir === 'in' ? 'Bank bayar pemain' : 'Pemain bayar bank',
    hint: `${note || (dir === 'in' ? 'Terima' : 'Bayar')} ${fmt(amt)} — imbas kad pemain`
  });
  if (!uid) { toast('Dibatalkan'); return; }
  const p = byUid(uid);
  if (!p) { vibe([80, 60, 80]); return showResult('err', 'Kad tidak dikenali', 'Kad ini belum didaftarkan.'); }
  if (dir === 'out' && p.balance < amt) {
    vibe([120, 60, 120]);
    return showResult('warn', 'Baki tak cukup',
      `<b>${esc(p.name)}</b> hanya ada <b>${fmt(p.balance)}</b>.<br>Jumlah diperlukan <b>${fmt(amt)}</b>.
       <div class="res-line"><span>Kurang</span><b>${fmt(amt - p.balance)}</b></div>`);
  }
  p.balance += dir === 'in' ? amt : -amt;
  addHist({ type: dir === 'in' ? 'bank-in' : 'bank-out', player: p.id, playerName: p.name, amount: amt, note: note || '' });
  save(); renderAll(); vibe([60, 40, 60]);
  bankAmt.clear();
  await showResult('ok', dir === 'in' ? 'Wang diterima' : 'Bayaran berjaya',
    `<div class="res-line"><span>${esc(p.name)}</span><b>${dir === 'in' ? '+' : '−'}${fmt(amt)}</b></div>
     <div class="res-line"><span>Baki baru</span><b>${fmt(p.balance)}</b></div>`);
}

async function checkBalance() {
  const uid = await scanCard({ title: 'Semak baki', hint: 'Imbas kad pemain untuk lihat baki.' });
  if (!uid) return;
  const p = byUid(uid);
  if (!p) { vibe([80, 60, 80]); return showResult('err', 'Kad tidak dikenali', 'Kad ini belum didaftarkan.'); }
  showResult('ok', p.name, `<div class="res-line"><span>Baki</span><b>${fmt(p.balance)}</b></div>`);
}

async function registerCard(p) {
  const uid = await scanCard({
    mode: 'register', title: 'Daftar kad — ' + p.name,
    hint: 'Letakkan kad NFC yang mahu dipasangkan dengan pemain ini.'
  });
  if (!uid) return;
  const other = byUid(uid);
  if (other && other.id !== p.id) {
    vibe([80, 60, 80]);
    return showResult('err', 'Kad sudah digunakan', `Kad ini sudah didaftarkan kepada <b>${esc(other.name)}</b>.`);
  }
  p.uid = uid;
  Sound.registered();
  save(); renderAll(); vibe();
  toast('Kad didaftarkan untuk ' + p.name);
}

function undoLast() {
  const h = state.history[0];
  if (!h) { toast('Tiada transaksi'); return; }
  if (!confirm('Buat asal transaksi terakhir?')) return;
  if (h.type === 'transfer') {
    const a = byId(h.from), b = byId(h.to);
    if (!a || !b) return toast('Pemain sudah dipadam');
    if (b.balance < h.amount) return toast('Baki penerima tak cukup untuk buat asal');
    b.balance -= h.amount; a.balance += h.amount;
  } else {
    const p = byId(h.player);
    if (!p) return toast('Pemain sudah dipadam');
    if (h.type === 'bank-in') {
      if (p.balance < h.amount) return toast('Baki tak cukup untuk buat asal');
      p.balance -= h.amount;
    } else {
      p.balance += h.amount;
    }
  }
  state.history.shift();
  save(); renderAll(); toast('Transaksi dibuat asal');
}

/* ================= Pemilih jumlah ================= */
function amountPicker(root) {
  root.innerHTML = `
    <div class="amt-wrap">
      <div class="amt-row">
        <div class="amt-box"><span class="amt-sym"></span>
          <input type="text" inputmode="numeric" placeholder="0" maxlength="7" aria-label="Jumlah"></div>
      </div>
      <div class="denoms"></div>
    </div>`;
  const input = $('input', root);
  const sym = $('.amt-sym', root);
  const wrap = $('.denoms', root);
  wrap.innerHTML = [...DENOMS].reverse().map(d =>
    `<button type="button" class="denom" data-d="${d}" style="background:${NOTE_COLORS[d]}">${d}</button>`
  ).join('') + '<button type="button" class="denom clear">Kosong</button>';
  input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').replace(/^0+(?=\d)/, ''); });
  wrap.addEventListener('click', e => {
    const b = e.target.closest('.denom');
    if (!b) return;
    if (b.classList.contains('clear')) { input.value = ''; return; }
    input.value = String((parseInt(input.value, 10) || 0) + parseInt(b.dataset.d, 10));
    vibe(15);
  });
  return {
    get: () => parseInt(input.value, 10) || 0,
    clear: () => { input.value = ''; },
    refresh: () => { sym.textContent = state.settings.symbol; }
  };
}

/* ================= Render ================= */
function renderPlayers() {
  const total = state.players.reduce((s, p) => s + p.balance, 0);
  $('#totalMoney').textContent = fmt(total);
  const list = $('#playerList');
  if (!state.players.length) {
    list.innerHTML = '<div class="empty">Belum ada pemain.<br>Tambah pemain di atas untuk mula.</div>';
    return;
  }
  list.innerHTML = state.players.map(p => {
    const notes = breakdown(p.balance).map(([d, n]) =>
      `<span class="note" style="background:${NOTE_COLORS[d]}">${n}×${d}</span>`).join('');
    return `
    <div class="player" style="--pc:${p.color}" data-id="${p.id}">
      <div class="p-top">
        <div class="p-name"><span class="dot"></span>${esc(p.name)}</div>
        <span class="badge ${p.uid ? 'ok' : 'no'}">${p.uid ? 'Kad ✓' : 'Belum ada kad'}</span>
      </div>
      <div class="p-bal">${fmt(p.balance)}</div>
      <div class="notes">${notes || '<span class="note" style="background:#555;color:#fff">Tiada wang</span>'}</div>
      <div class="p-actions">
        <button class="btn ghost" data-act="reg">${p.uid ? 'Tukar kad' : 'Daftar kad'}</button>
        <button class="btn ghost" data-act="del">Padam</button>
      </div>
    </div>`;
  }).join('');
}

function renderHistory() {
  const el = $('#historyList');
  if (!state.history.length) { el.innerHTML = '<div class="empty">Tiada transaksi lagi.</div>'; return; }
  const time = t => new Date(t).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
  el.innerHTML = state.history.map(h => {
    let main, sub, cls, sign;
    if (h.type === 'transfer') {
      main = `${esc(h.fromName)} → ${esc(h.toName)}`; sub = 'Pindahan pemain'; cls = 'neu'; sign = '';
    } else if (h.type === 'bank-in') {
      main = esc(h.playerName); sub = 'Bank → ' + esc(h.note || 'Terima'); cls = 'pos'; sign = '+';
    } else {
      main = esc(h.playerName); sub = 'Bank ← ' + esc(h.note || 'Bayar'); cls = 'neg'; sign = '−';
    }
    return `<div class="h-item"><div><div class="h-main">${main}</div>
      <div class="h-sub">${sub} · ${time(h.t)}</div></div>
      <div class="h-amt ${cls}">${sign}${fmt(h.amount)}</div></div>`;
  }).join('');
}

function renderQuick() {
  $$('[data-q]').forEach(b => { b.textContent = fmt(b.dataset.q); });
}
function renderChip() {
  const c = $('#nfcChip');
  if (!NFC.ok) { c.textContent = 'Simulasi'; c.className = 'chip sim'; }
  else if (state.settings.sim) { c.textContent = 'Simulasi'; c.className = 'chip sim'; }
  else { c.textContent = 'NFC aktif'; c.className = 'chip on'; }
}
function renderAll() {
  renderPlayers(); renderHistory(); renderQuick(); renderChip();
  transferAmt.refresh(); bankAmt.refresh();
}

/* ================= Init UI ================= */
const transferAmt = amountPicker($('#transferAmt'));
const bankAmt = amountPicker($('#bankAmt'));

$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.toggle('active', x === t));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + t.dataset.view));
  window.scrollTo({ top: 0 });
}));

$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#newName').value.trim();
  if (!name) return;
  if (state.players.length >= MAX_PLAYERS) return toast('Maksimum ' + MAX_PLAYERS + ' pemain');
  if (state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast('Nama sudah wujud');
  const used = state.players.map(p => p.color);
  const color = PALETTE.find(c => !used.includes(c)) || PALETTE[0];
  const p = {
    id: 'p' + Date.now().toString(36) + Math.random().toString(16).slice(2, 4),
    name, color, uid: null, balance: Number(state.settings.start) || 0
  };
  state.players.push(p);
  $('#newName').value = '';
  save(); renderAll();
  registerCard(p);
});
  
$('#playerList').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const p = byId(btn.closest('.player').dataset.id);
  if (!p) return;
  if (btn.dataset.act === 'reg') registerCard(p);
  if (btn.dataset.act === 'del') {
    if (!confirm(`Padam pemain ${p.name}?`)) return;
    state.players = state.players.filter(x => x.id !== p.id);
    save(); renderAll();
  }
});

$('#btnCheck').addEventListener('click', checkBalance);
$('#btnTransfer').addEventListener('click', doTransfer);
$('#btnBankIn').addEventListener('click', () => doBank('in', bankAmt.get(), 'Bank bayar'));
$('#btnBankOut').addEventListener('click', () => doBank('out', bankAmt.get(), 'Bayar bank'));
$$('.quick').forEach(q => q.addEventListener('click', () =>
  doBank(q.dataset.dir, parseInt(q.dataset.amt, 10), q.dataset.note)));
$('#btnUndo').addEventListener('click', undoLast);

/* tetapan */
$('#btnSettings').addEventListener('click', () => {
  $('#setStart').value = state.settings.start;
  $('#setSymbol').value = state.settings.symbol;
  $('#setSim').checked = !!state.settings.sim;
  $('#setSound').checked = state.settings.sound !== false;
  $('#setSim').disabled = !NFC.ok;
  openModal('settingsModal');
});
$('#setSound').addEventListener('change', e => { if (e.target.checked) { state.settings.sound = true; Sound.success(); } });
$('#setClose').addEventListener('click', () => {
  const st = parseInt($('#setStart').value, 10);
  state.settings.start = isNaN(st) || st < 0 ? 1500 : st;
  state.settings.symbol = $('#setSymbol').value;
  state.settings.sim = $('#setSim').checked;
  state.settings.sound = $('#setSound').checked;
  save(); renderAll(); closeModal('settingsModal');
});
$('#btnResetGame').addEventListener('click', () => {
  if (!confirm('Set semula semua baki dan sejarah? Pemain & kad kekal.')) return;
  const st = Number($('#setStart').value);
  const start = isNaN(st) || st < 0 ? state.settings.start : st;
  state.settings.start = start;
  state.players.forEach(p => { p.balance = start; });
  state.history = [];
  save(); renderAll(); closeModal('settingsModal'); toast('Permainan disetkan semula');
});
$('#btnWipe').addEventListener('click', () => {
  if (!confirm('Padam SEMUA pemain, kad dan sejarah?')) return;
  const settings = state.settings;
  state = defaultState();
  state.settings = settings;
  save(); renderAll(); closeModal('settingsModal'); toast('Semua dipadam');
});

renderAll();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* abaikan */ });
  });
}

<script>
window.addEventListener('load', function () {
  if (window.__appLoaded) return;
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;background:#b91c1c;color:#fff;padding:12px;font:13px/1.45 sans-serif;text-align:left;word-break:break-word';
  d.textContent = 'app.js tidak berjalan. Memeriksa sebab...';
  document.body.appendChild(d);
  var info = ['app.js tidak berjalan.'];
  if (window.__errs.length) info.push('Ralat: ' + window.__errs.join(' | '));
  fetch('app.js', { cache: 'no-store' }).then(function (r) {
    info.push('Status: ' + r.status + ', jenis: ' + (r.headers.get('content-type') || 'tiada'));
    return r.text();
  }).then(function (t) {
    info.push('Saiz: ' + t.length + ' aksara. Mula: ' + t.slice(0, 40).replace(/\s+/g, ' '));
  }).catch(function (e) {
    info.push('Tak dapat ambil app.js: ' + e);
  }).then(function () {
    d.textContent = info.join('  ·  ');
  });
});
</script>
